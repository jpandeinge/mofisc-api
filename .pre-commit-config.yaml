default_stages: [pre-commit, pre-push]

repos:
-   repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.4.0
    hooks:
    -   id: trailing-whitespace
    -   id: end-of-file-fixer
    -   id: check-yaml
    -   id: check-added-large-files
-   repo: local
    hooks:
    -   id: uv-isort
        name: uv run isort (api/)
        entry: uv run --no-project --with-requirements requirements-lint.txt isort api/
        language: system
        pass_filenames: false
        files: ^api/
    -   id: uv-black
        name: uv run black (api/)
        entry: uv run --no-project --with-requirements requirements-lint.txt black api/
        language: system
        pass_filenames: false
        files: ^api/
-   repo: https://github.com/PyCQA/flake8
    rev: 6.0.0
    hooks:
    -   id: flake8
        stages: [pre-push]
-   repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.3.0
    hooks:
    -   id: mypy
        stages: [pre-push]
